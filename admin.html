<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riftline Admin</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b10;color:#eef3f8;font:14px system-ui,-apple-system,sans-serif}.w{width:min(1050px,calc(100% - 28px));margin:40px auto}h1{font-size:34px;margin:0 0 8px}p{color:#9aa7b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#101620;border:1px solid #253044;border-radius:14px;padding:18px;margin:14px 0}label{display:block;color:#9aa7b8;font-size:12px;margin:12px 0 6px}input,select,textarea,button{width:100%;border:1px solid #2a374a;background:#0a0f16;color:#eef3f8;border-radius:9px;padding:11px;font:inherit}textarea{min-height:100px;resize:vertical}button{cursor:pointer;font-weight:800;background:#edf4f8;color:#081016;margin-top:12px}.secondary{background:#131c28;color:#eef3f8}.matches{display:grid;gap:10px}.match{border:1px solid #253044;border-radius:12px;padding:14px;background:#0c121a}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{width:auto;min-width:90px}.status{color:#72f0c1}.err{color:#ff9b9b;white-space:pre-wrap}.mono{font-family:ui-monospace,monospace;color:#c8d2df}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>Riftline Tournament Admin</h1><p>This page does not contain credentials. The admin token is kept only in this browser session. On GitHub Pages, set API URL to your deployed backend URL.</p>
<div class="card"><div class="grid"><div><label>API URL</label><input id="api" placeholder="https://api.example.com"></div><div><label>Admin token</label><input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN"></div></div><button class="secondary" onclick="save()">Save session settings</button></div>
<div class="card"><h2>Create lobby job</h2><div class="grid"><div><label>Match name</label><input id="name" value="Riftline Open 2026"></div><div><label>Series</label><select id="bo"><option value="3">BO3</option><option value="5">BO5</option></select></div><div><label>Radiant SteamID64 — one per line</label><textarea id="rad"></textarea></div><div><label>Dire SteamID64 — one per line</label><textarea id="dire"></textarea></div></div><button onclick="createMatch()">Queue lobby</button><div id="createOut" class="mono"></div></div>
<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2>Matches</h2><button class="secondary" onclick="load()" style="width:auto">Refresh</button></div><div id="error" class="err"></div><div id="matches" class="matches"></div></div></div>
<script>
const $=id=>document.getElementById(id);
$('api').value=sessionStorage.getItem('riftApi')||'';
$('token').value=sessionStorage.getItem('riftToken')||'';
function save(){sessionStorage.setItem('riftApi',$('api').value.trim().replace(/\/$/,''));sessionStorage.setItem('riftToken',$('token').value);load()}
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+$('token').value}}
function base(){return $('api').value.trim().replace(/\/$/,'')}
async function req(path,opt={}){const r=await fetch(base()+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null}
function players(id){return $(id).value.split(/\n|,/).map(x=>x.trim()).filter(Boolean)}
async function createMatch(){try{save();const x=await req('/api/matches',{method:'POST',body:JSON.stringify({name:$('name').value,bestOf:Number($('bo').value),radiant:players('rad'),dire:players('dire')})});$('createOut').textContent='Queued · password '+x.password;await load()}catch(e){$('createOut').textContent=e.message}}
async function action(id,a){try{await req('/api/matches/'+encodeURIComponent(id)+'/action',{method:'POST',body:JSON.stringify({action:a})});await load()}catch(e){$('error').textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!base()||!$('token').value)return;try{$('error').textContent='';const rows=await req('/api/matches');$('matches').innerHTML=rows.slice().reverse().map(m=>`<div class="match"><b>${esc(m.name)}</b> · <span class="status">${esc(m.status)}</span><div class="mono">Password: ${esc(m.password)} · Lobby: ${esc(m.lobbyId||'—')} · BO${esc(m.bestOf)}</div>${m.error?`<div class="err">${esc(m.error)}</div>`:''}<div class="row"><button onclick="action('${esc(m.id)}','launch')">Launch</button><button class="secondary" onclick="action('${esc(m.id)}','destroy')">Destroy</button><button class="secondary" onclick="action('${esc(m.id)}','cancel')">Cancel</button></div></div>`).join('')||'<p>No matches yet.</p>'}catch(e){$('error').textContent=e.message}}
</script></body></html>
